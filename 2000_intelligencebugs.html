  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];

    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';

      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;
    }

      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;--cyan:#22697F;--hair:rgba(0,0,0,.12);--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace;--serif:'Libre Caslon Text',Georgia,serif}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);padding:26px 22px 40px}\n.wrap{max-width:1280px;margin:0 auto}\n.kick{font:600 13px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--amber)}\nh1{font:400 40px/1.14 var(--serif);margin:10px 0 8px}\nh1 em{color:var(--amber-d);font-style:italic}\n.lede{font:400 17px/1.55 var(--sans);color:var(--soft);max-width:900px;margin:0}\n.layout{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(280px,1fr);gap:18px;margin-top:22px;align-items:start}\n.card{background:var(--panel);border:1px solid var(--hair);border-radius:14px;padding:16px}\ncanvas{display:block;width:100%;height:auto;border-radius:10px;background:#141A26}\n.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}\nbutton{font:500 14px/1 var(--sans);padding:10px 15px;border:1px solid var(--hair);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer;transition:.15s}\nbutton:hover{border-color:var(--amber);color:var(--amber-d)}\nbutton.on{background:var(--ink);color:#fff;border-color:var(--ink)}\nbutton.pri{background:var(--amber);border-color:var(--amber);color:#fff}\nbutton.pri:hover{background:var(--amber-d);border-color:var(--amber-d);color:#fff}\n.seg{display:flex;border:1px solid var(--hair);border-radius:999px;overflow:hidden}\n.seg button{border:0;border-radius:0;padding:10px 13px}\n.seg button+button{border-left:1px solid var(--hair)}\n.hint{font:400 13.5px/1.45 var(--sans);color:var(--dim);margin-left:auto;text-align:right;max-width:330px}\n.mt{font:600 11.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:9px}\n.big{font:500 34px/1 var(--mono);color:var(--amber-d);letter-spacing:-.5px}\n.big small{font:500 15px/1 var(--mono);color:var(--dim);letter-spacing:0}\n.rows{display:flex;flex-direction:column;gap:9px;margin-top:12px}\n.row{display:flex;justify-content:space-between;gap:12px;font:400 14.5px/1.3 var(--sans);color:var(--soft);border-top:1px solid var(--hair);padding-top:9px}\n.row:first-child{border-top:0;padding-top:0}\n.row b{font:500 14.5px/1.3 var(--mono);color:var(--ink)}\n#chart{background:#fff;border:1px solid var(--hair)}\n.wbars{display:flex;flex-direction:column;gap:7px;margin-top:2px}\n.wb{display:grid;grid-template-columns:120px 1fr 58px;gap:10px;align-items:center;font:400 12.5px/1.2 var(--mono);color:var(--dim)}\n.wt{height:10px;background:rgba(0,0,0,.07);border-radius:99px;position:relative;overflow:hidden}\n.wt::after{content:\"\";position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(0,0,0,.18)}\n.wf{position:absolute;top:0;bottom:0;background:var(--cyan);transition:width .2s,left .2s}\n.wv{text-align:right;font:500 12.5px/1.2 var(--mono);color:var(--ink)}\n.note{font:400 13.5px/1.5 var(--sans);color:var(--dim);margin-top:12px;border-top:1px solid var(--hair);padding-top:11px}\nfooter{margin-top:24px;font:400 15px/1.6 var(--sans);color:var(--soft);border-top:1px solid var(--hair);padding-top:16px;max-width:980px}\na{color:var(--amber-d)}\nheader{position:relative}\n.prin-btn{position:absolute;top:2px;right:0;font:500 14px/1 var(--sans);padding:11px 18px;border:1px solid var(--amber);border-radius:999px;background:#fff;color:var(--amber-d)}\n.prin-btn:hover{background:var(--amber);border-color:var(--amber);color:#fff}\n.pov{position:fixed;inset:0;z-index:99;display:none;place-items:center;padding:32px;background:rgba(28,32,44,.5);backdrop-filter:blur(3px)}\n.pov.on{display:grid}\n.pbox{position:relative;max-width:760px;background:var(--panel);border:1px solid var(--hair);border-radius:18px;padding:40px 48px 44px;box-shadow:0 40px 110px -30px rgba(0,0,0,.45)}\n.pbox p{font:400 21px/1.6 var(--sans);color:var(--soft);margin:18px 0 0}\n.pbox .pbig{font:400 27px/1.45 var(--serif);color:var(--ink);margin-top:24px;border-top:1px solid var(--hair);padding-top:22px}\n.pclose{position:absolute;top:14px;right:16px;width:40px;height:40px;padding:0;border-radius:999px;font:500 17px/1 var(--sans)}\n@media(max-width:960px){.layout{grid-template-columns:1fr}.prin-btn{position:static;margin-bottom:14px}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<div class=\"wrap\">\n<header>\n  <button id=\"prin\" class=\"prin-btn\">◈ Temel prensip<\u002Fbutton>\n  <div class=\"kick\">2000 · İlkay Benian ile<\u002Fdiv>\n  <h1>Kendi Kendine Nişan Almayı <em>Öğrenen<\u002Fem> Oyun<\u002Fh1>\n  <p class=\"lede\">Aşağıda bir top, yukarıda hızlanıp yavaşlayan, aniden rota değiştiren hedefler. Aradaki gezegenler mermiyi kendine çekiyor. Oyun hiçbir formül bilmeden başlıyor: on atıştan birini tutturuyor. Zamanla bu oran yükseliyor.<\u002Fp>\n<\u002Fheader>\n\n<div class=\"pov\" id=\"pov\">\n  <div class=\"pbox\">\n    <button class=\"pclose\" id=\"pclose\" aria-label=\"Kapat\">✕<\u002Fbutton>\n    <div class=\"kick\">Temel prensip<\u002Fdiv>\n    <p>Kimse bu sisteme yerçekimi formülü yazmadı, hatta “gezegen var” bile demedi. Sadece isabet edip etmediğini söyledi. Sistem, çekimin tersine nişan alması gerektiğini kendi buldu — ve ne kadar tersine alacağını da.<\u002Fp>\n    <p class=\"pbig\">Bugünkü modellerin yaptığı iş bundan farklı değil; sadece altı parametre yerine yüz milyarlarcası var.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"layout\">\n  <div>\n    <div class=\"card\">\n      <canvas id=\"cv\" width=\"1120\" height=\"660\"><\u002Fcanvas>\n      <div class=\"bar\">\n        <button id=\"play\" class=\"pri\">▶ Başlat<\u002Fbutton>\n        <div class=\"seg\" id=\"spd\">\n          <button data-s=\"1\" class=\"on\">1×<\u002Fbutton>\n          <button data-s=\"60\">60×<\u002Fbutton>\n          <button data-s=\"600\">600×<\u002Fbutton>\n          <button data-s=\"4000\">4000×<\u002Fbutton>\n        <\u002Fdiv>\n        <button id=\"manual\">🎯 Önce sen dene<\u002Fbutton>\n        <button id=\"snd\">🔊 Ses<\u002Fbutton>\n        <button id=\"reset\">↺ Sıfırla<\u002Fbutton>\n        <span class=\"hint\" id=\"hint\">Hız arttıkça sahne aynı kalır, arkada binlerce atış birden denenir.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div>\n    <div class=\"card\">\n      <div class=\"mt\">İsabet oranı<\u002Fdiv>\n      <div class=\"big\" id=\"rate\">–<small> / 10<\u002Fsmall><\u002Fdiv>\n      <canvas id=\"chart\" width=\"560\" height=\"200\" style=\"margin-top:12px;border-radius:8px\"><\u002Fcanvas>\n      <div class=\"rows\">\n        <div class=\"row\"><span>Toplam atış<\u002Fspan><b id=\"shots\">0<\u002Fb><\u002Fdiv>\n        <div class=\"row\"><span>Geçen süre<\u002Fspan><b id=\"days\">0 gün<\u002Fb><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"note\">Süre, üç ayda yapılan yaklaşık iki milyon atışa göre ölçeklenir.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\" style=\"margin-top:14px\">\n      <div class=\"mt\">Altı ağırlık · kendi kendine düzeliyor<\u002Fdiv>\n      <div class=\"wbars\" id=\"wbars\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<footer>\n  Üç ayın sonunda oyun on atışın beşini tutturur hale gelmişti. O noktaya milyonlarca deneme ile gelmişti.\n<\u002Ffooter>\n<\u002Fdiv>\n\n<script>\n(function(){\nconst cv=document.getElementById('cv'),ctx=cv.getContext('2d');\nconst W=cv.width,H=cv.height;\nconst GUN={x:W/2,y:H-46};\nconst BSPD=560, DT=1/60, MAXT=3.2;\nconst TARGET_SHOTS=2000000, TARGET_DAYS=90;\n\n/* iki ayrı rastgele akış: senaryolar ve mutasyon birbirini bozmasın */\nfunction mkRng(s){let x=s>>>0||1;return function(){x=(x*1664525+1013904223)>>>0;return x/4294967296}}\nconst mut=mkRng(987654321);\nlet scenSeed=20000;\n\nconst PLANETS=[\n  {cx:330,cy:300,r:120,a:0,w:0.35,rad:26,m:52000},\n  {cx:800,cy:250,r:150,a:2.1,w:-0.24,rad:34,m:88000},\n  {cx:560,cy:430,r:90,a:4.0,w:0.5,rad:19,m:30000}\n];\nfunction planetsAt(t){return PLANETS.map(p=>({x:p.cx+Math.cos(p.a+p.w*t)*p.r,y:p.cy+Math.sin(p.a+p.w*t)*p.r*0.55,rad:p.rad,m:p.m}))}\nconst KINDS=['ship','rock','crea'];\n\n/* senaryo: rota değişimleri ÖNCEDEN çekilir → değerlendirme tekrarlanabilir */\nfunction makeScenario(rng){\n  const dir=rng()<.5?1:-1;\n  const s={x:dir>0?30+rng()*150:W-180+rng()*150,y:70+rng()*230,\n    vx:dir*(55+rng()*110),vy:-28+rng()*56,ax:-24+rng()*48,ay:-9+rng()*18,\n    t0:rng()*12,kind:KINDS[(rng()*3)|0],ev:[]};\n  let t=0.4+rng()*1.6;\n  while(t<MAXT){ s.ev.push({t:t,ax:-40+rng()*80,ay:-16+rng()*32,flip:rng()<.42}); t+=0.5+rng()*1.5; }\n  return s;\n}\nfunction newTargetState(s){return {x:s.x,y:s.y,vx:s.vx,vy:s.vy,ax:s.ax,ay:s.ay,kind:s.kind,ei:0}}\nfunction advance(o,s,t,dt){\n  while(s&&o.ei<s.ev.length&&t>=s.ev[o.ei].t){\n    const e=s.ev[o.ei++]; o.ax=e.ax; o.ay=e.ay; if(e.flip)o.vx*=-1;\n  }\n  o.vx+=o.ax*dt; o.vy+=o.ay*dt;\n  o.vx=Math.max(-230,Math.min(230,o.vx)); o.vy=Math.max(-70,Math.min(70,o.vy));\n  o.x+=o.vx*dt; o.y+=o.vy*dt;\n  if(o.x<24||o.x>W-24){o.vx*=-1;o.x=Math.max(24,Math.min(W-24,o.x))}\n  if(o.y<50||o.y>360){o.vy*=-1;o.y=Math.max(50,Math.min(360,o.y))}\n}\n\n/* nişan: görüş hattına dik/paralel bileşenlerden doğrusal düzeltme */\nconst NW=6;\nfunction zeros(){return new Array(NW).fill(0)}\nfunction feats(o,t0){\n  const dx=o.x-GUN.x, dy=o.y-GUN.y, dist=Math.max(40,Math.hypot(dx,dy));\n  const base=Math.atan2(dy,dx), ux=Math.cos(base), uy=Math.sin(base), px=-uy, py=ux;\n  const T=dist/BSPD;\n  const vP=o.vx*px+o.vy*py, vL=o.vx*ux+o.vy*uy;\n  const aP=o.ax*px+o.ay*py;\n  const mx=GUN.x+ux*dist*0.5, my=GUN.y+uy*dist*0.5;\n  let gx=0,gy=0;\n  for(const p of planetsAt(t0)){const ddx=p.x-mx,ddy=p.y-my,d2=Math.max(2500,ddx*ddx+ddy*ddy),d=Math.sqrt(d2),a=p.m/d2;gx+=a*ddx/d;gy+=a*ddy/d}\n  const gP=gx*px+gy*py;\n  return {base:base,f:[vP/BSPD, aP*T/BSPD, (vP/BSPD)*(vL/BSPD), gP*T/BSPD, gP*T*T/BSPD*4, 0.05]};\n}\nfunction aim(w,o,t0){\n  const q=feats(o,t0); let c=0;\n  for(let i=0;i<NW;i++) c+=w[i]*q.f[i];\n  return q.base+Math.max(-0.9,Math.min(0.9,c));\n}\n\n/* tek atışı deterministik simüle et */\nfunction simulate(w,s){\n  const o=newTargetState(s), t0=s.t0;\n  const ang=aim(w,o,t0);\n  let bx=GUN.x,by=GUN.y,vx=Math.cos(ang)*BSPD,vy=Math.sin(ang)*BSPD,t=0;\n  while(t<MAXT){\n    for(const p of planetsAt(t0+t)){\n      const dx=p.x-bx,dy=p.y-by,d2=Math.max(900,dx*dx+dy*dy),d=Math.sqrt(d2),a=p.m/d2;\n      vx+=a*dx/d*DT; vy+=a*dy/d*DT;\n      if(d<p.rad+3) return false;\n    }\n    bx+=vx*DT; by+=vy*DT; t+=DT;\n    advance(o,s,t,DT);\n    if(Math.hypot(bx-o.x,by-o.y)<19) return true;\n    if(bx<-40||bx>W+40||by<-40||by>H+40) return false;\n  }\n  return false;\n}\n\n/* eğitim: aynı senaryo grubu üzerinde mevcut ile aday karşılaştırılır */\nconst BATCH=24, BATCH_LIFE=10;\nlet Wb=zeros(), sigma=0.34, batch=[], batchAge=1e9, incScore=0;\nlet totalShots=0, win=[], curve=[];\n\nfunction newBatch(){\n  const rng=mkRng(scenSeed++); batch=[];\n  for(let i=0;i<BATCH;i++) batch.push(makeScenario(rng));\n  batchAge=0; incScore=score(Wb); totalShots+=BATCH;\n}\nfunction score(w){let h=0;for(const s of batch) if(simulate(w,s))h++;return h/BATCH}\nfunction trainStep(){\n  if(batchAge>=BATCH_LIFE) newBatch();\n  batchAge++;\n  const cand=Wb.map(v=>v+(mut()*2-1)*sigma);\n  const sc=score(cand); totalShots+=BATCH;\n  if(sc>incScore){ Wb=cand; incScore=sc; sigma=Math.min(.45,sigma*1.08); }\n  else sigma=Math.max(.02,sigma*0.992);\n  win.push(incScore); if(win.length>60)win.shift();\n}\n\n/* sahne */\nlet scenes=[], states=[], shot=null, cool=0, clock=0, running=false, speed=1, manual=false, flashes=[], lastMouse=-Math.PI/2;\nfunction respawn(i){const rng=mkRng(scenSeed++);scenes[i]=makeScenario(rng);const o=newTargetState(scenes[i]);o.st=0;o.fade=0;o.dying=0;o.next=1.0+rng()*1.4;\n  o.x=o.vx>0?-40:W+40; states[i]=o;}\n/* sahnede duvara çarpma yok: hedefler yanlardan girip yanlardan çıkar */\nfunction sceneAdvance(o,s,dt){\n  while(s&&o.ei<s.ev.length&&o.st>=s.ev[o.ei].t){const e=s.ev[o.ei++];o.ax=e.ax;o.ay=e.ay;if(e.flip)o.vx*=-1}\n  o.next-=dt;\n  if(o.next<=0){o.ax=-40+Math.random()*80;o.ay=-16+Math.random()*32;o.next=0.8+Math.random()*1.6}\n  o.vx+=o.ax*dt; o.vy+=o.ay*dt;\n  o.vx=Math.max(-230,Math.min(230,o.vx)); o.vy=Math.max(-70,Math.min(70,o.vy));\n  if(Math.abs(o.vx)<28) o.vx=o.vx>=0?28:-28;\n  o.x+=o.vx*dt; o.y+=o.vy*dt;\n  if(o.y<50){o.y=50;o.vy=Math.abs(o.vy)} if(o.y>360){o.y=360;o.vy=-Math.abs(o.vy)}\n  o.fade=Math.min(1,o.fade+dt*2.2);\n}\nfor(let i=0;i<3;i++) respawn(i);\n\nfunction stepScene(dt){\n  clock+=dt;\n  for(let i=0;i<3;i++){ const o=states[i];\n    if(o.dying>0){ o.dying-=dt; if(o.dying<=0) respawn(i); continue; }\n    o.st+=dt; sceneAdvance(o,scenes[i],dt);\n    if(o.x<-70||o.x>W+70) respawn(i); }\n  if(shot){\n    for(const p of planetsAt(clock)){\n      const dx=p.x-shot.x,dy=p.y-shot.y,d2=Math.max(900,dx*dx+dy*dy),d=Math.sqrt(d2),a=p.m/d2;\n      shot.vx+=a*dx/d*dt; shot.vy+=a*dy/d*dt;\n      if(d<p.rad+3){ flashes.push({x:shot.x,y:shot.y,t:0,ok:false}); missSfx(); shot=null; break; }\n    }\n  }\n  if(shot){\n    shot.x+=shot.vx*dt; shot.y+=shot.vy*dt; shot.t+=dt;\n    shot.trail.push([shot.x,shot.y]); if(shot.trail.length>90)shot.trail.shift();\n    for(let i=0;i<3;i++) if(Math.hypot(shot.x-states[i].x,shot.y-states[i].y)<20){\n      flashes.push({x:states[i].x,y:states[i].y,t:0,ok:true}); hitSfx(); states[i].dying=0.5; shot=null; break;\n    }\n  }\n  if(shot&&(shot.t>MAXT||shot.x<-40||shot.x>W+40||shot.y<-40)){ flashes.push({x:shot.x,y:shot.y,t:0,ok:false}); missSfx(); shot=null; }\n  if(!shot){ cool-=dt; if(cool<=0&&!manual){ const ang=aim(Wb,states[0],clock); shot={x:GUN.x,y:GUN.y,vx:Math.cos(ang)*BSPD,vy:Math.sin(ang)*BSPD,t:0,trail:[]}; shotSfx(); cool=1.0; } }\n  flashes=flashes.filter(f=>(f.t+=dt)<.45);\n}\n\nfunction drawTarget(o){\n  var dy=o.dying>0?o.dying/0.5:1;\n  ctx.save(); ctx.globalAlpha=(o.fade===undefined?1:o.fade)*dy; ctx.translate(o.x,o.y);\n  if(dy<1){ ctx.rotate((1-dy)*2.4); ctx.scale(1+(1-dy)*0.9, 1+(1-dy)*0.9); }\n  if(o.kind==='ship'){\n    ctx.fillStyle='#7FD3C4'; ctx.beginPath();\n    ctx.moveTo(-15,0);ctx.lineTo(0,-8);ctx.lineTo(15,0);ctx.lineTo(0,7);ctx.closePath();ctx.fill();\n    ctx.fillStyle='#0F1620'; ctx.fillRect(-4,-3,8,3);\n  }else if(o.kind==='rock'){\n    ctx.fillStyle='#9A8C7A'; ctx.beginPath();\n    for(let i=0;i<8;i++){const a=i/8*6.283;const r=11+((i*37)%7);ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r*.8)}\n    ctx.closePath();ctx.fill();\n  }else{\n    ctx.fillStyle='#D68FC4'; ctx.beginPath(); ctx.ellipse(0,0,13,10,0,0,6.283); ctx.fill();\n    ctx.fillStyle='#2A1830'; ctx.beginPath(); ctx.arc(-4,-2,2.4,0,6.283); ctx.arc(4,-2,2.4,0,6.283); ctx.fill();\n  }\n  ctx.restore(); ctx.globalAlpha=1;\n}\nfunction draw(){\n  ctx.fillStyle='#141A26'; ctx.fillRect(0,0,W,H);\n  ctx.fillStyle='rgba(255,255,255,.22)';\n  for(let i=0;i<70;i++){const x=(i*137.5)%W,y=(i*89.3)%(H-90);ctx.fillRect(x,y,1.6,1.6)}\n  PLANETS.forEach(p=>{ctx.strokeStyle='rgba(255,255,255,.10)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(p.cx,p.cy,p.r,p.r*.55,0,0,6.283);ctx.stroke()});\n  planetsAt(clock).forEach(p=>{\n    const g=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,p.rad*2.6);\n    g.addColorStop(0,'rgba(169,100,12,.35)'); g.addColorStop(1,'rgba(169,100,12,0)');\n    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,p.rad*2.6,0,6.283); ctx.fill();\n    ctx.fillStyle='#C8823B'; ctx.beginPath(); ctx.arc(p.x,p.y,p.rad,0,6.283); ctx.fill();\n    ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.arc(p.x+p.rad*.3,p.y-p.rad*.25,p.rad*.45,0,6.283); ctx.fill();\n  });\n  states.forEach(drawTarget);\n  if(shot){\n    ctx.strokeStyle='rgba(255,196,88,.55)'; ctx.lineWidth=2; ctx.beginPath();\n    shot.trail.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();\n    ctx.fillStyle='#FFD489'; ctx.beginPath(); ctx.arc(shot.x,shot.y,4,0,6.283); ctx.fill();\n  }\n  flashes.forEach(f=>{const a=1-f.t/.45;ctx.strokeStyle=f.ok?`rgba(90,220,150,${a})`:`rgba(220,110,90,${a})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y,10+f.t*70,0,6.283);ctx.stroke()});\n  const ang=manual?lastMouse:aim(Wb,states[0],clock);\n  ctx.save(); ctx.translate(GUN.x,GUN.y); ctx.rotate(ang); ctx.fillStyle='#E8E2D8'; ctx.fillRect(0,-5,42,10); ctx.restore();\n  ctx.fillStyle='#E8E2D8'; ctx.beginPath(); ctx.arc(GUN.x,GUN.y,15,0,6.283); ctx.fill();\n  ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font='500 15px IBM Plex Mono, monospace';\n  ctx.fillText(manual?'MANUEL — tıklayarak ateş edin':'OTOMATİK',18,H-16);\n}\n\nconst ch=document.getElementById('chart'),cx2=ch.getContext('2d');\nfunction drawChart(){\n  const w=ch.width,h=ch.height;\n  cx2.fillStyle='#fff'; cx2.fillRect(0,0,w,h);\n  cx2.strokeStyle='rgba(0,0,0,.10)'; cx2.lineWidth=1;\n  for(let i=0;i<=5;i++){const y=14+(h-40)*i/5;cx2.beginPath();cx2.moveTo(38,y);cx2.lineTo(w-10,y);cx2.stroke()}\n  cx2.fillStyle='#8A90A0'; cx2.font='500 11px IBM Plex Mono, monospace';\n  cx2.fillText('10/10',4,18); cx2.fillText('5/10',10,14+(h-40)*.5+4); cx2.fillText('0',26,h-22);\n  cx2.strokeStyle='rgba(34,105,127,.45)'; cx2.setLineDash([5,5]); cx2.lineWidth=1.5;\n  const y5=14+(h-40)*.5; cx2.beginPath();cx2.moveTo(38,y5);cx2.lineTo(w-10,y5);cx2.stroke(); cx2.setLineDash([]);\n  if(curve.length>1){\n    cx2.strokeStyle='#A9640C'; cx2.lineWidth=2.4; cx2.beginPath();\n    curve.forEach((v,i)=>{const x=38+(w-48)*i/Math.max(1,curve.length-1),y=14+(h-40)*(1-v);i?cx2.lineTo(x,y):cx2.moveTo(x,y)});\n    cx2.stroke();\n  }\n  cx2.fillStyle='#8A90A0'; cx2.fillText('atış sayısı →',w-92,h-6);\n}\n\n/* ses — Web Audio ile sentezlenir, dosya yok */\nlet AC=null, MASTER=null, sndOn=true;\nfunction ac(){\n  if(!AC){\n    AC=new (window.AudioContext||window.webkitAudioContext)();\n    MASTER=AC.createGain(); MASTER.gain.value=sndOn?0.9:0;\n    const rev=AC.createConvolver(), len=AC.sampleRate*1.6, b=AC.createBuffer(2,len,AC.sampleRate);\n    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}\n    rev.buffer=b;\n    const wet=AC.createGain(); wet.gain.value=0.32;\n    MASTER.connect(AC.destination); MASTER.connect(rev); rev.connect(wet); wet.connect(AC.destination);\n  }\n  if(AC.state==='suspended')AC.resume();\n  return AC;\n}\nfunction out(){ ac(); return MASTER; }\nfunction env(g,t,peak,atk,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+atk);g.gain.exponentialRampToValueAtTime(0.0001,t+dec)}\n\nfunction shotSfx(){\n  if(!sndOn)return; const a=ac(), t=a.currentTime;\n  const o=a.createOscillator(), g=a.createGain(), f=a.createBiquadFilter();\n  o.type='sawtooth'; o.frequency.setValueAtTime(1250,t); o.frequency.exponentialRampToValueAtTime(190,t+0.24);\n  f.type='bandpass'; f.frequency.setValueAtTime(2200,t); f.frequency.exponentialRampToValueAtTime(420,t+0.24); f.Q.value=9;\n  env(g,t,0.20,0.006,0.28);\n  o.connect(f); f.connect(g); g.connect(out()); o.start(t); o.stop(t+0.3);\n  const sub=a.createOscillator(), sg=a.createGain();\n  sub.type='sine'; sub.frequency.setValueAtTime(320,t); sub.frequency.exponentialRampToValueAtTime(90,t+0.16);\n  env(sg,t,0.14,0.004,0.2); sub.connect(sg); sg.connect(out()); sub.start(t); sub.stop(t+0.22);\n}\n\nfunction hitSfx(){\n  if(!sndOn)return; const a=ac(), t=a.currentTime;\n  /* 1 · derin implozyon */\n  const sub=a.createOscillator(), sg=a.createGain();\n  sub.type='sine'; sub.frequency.setValueAtTime(190,t); sub.frequency.exponentialRampToValueAtTime(32,t+0.75);\n  env(sg,t,0.42,0.012,0.85); sub.connect(sg); sg.connect(out()); sub.start(t); sub.stop(t+0.9);\n  /* 2 · metalik çınlama — üç uyumsuz kısmi ton */\n  [523,791,1187].forEach((fr,i)=>{\n    const o=a.createOscillator(), g=a.createGain();\n    o.type='triangle'; o.frequency.setValueAtTime(fr,t); o.frequency.exponentialRampToValueAtTime(fr*0.55,t+0.9);\n    env(g,t+i*0.012,0.13-i*0.03,0.01,0.95+i*0.15);\n    o.connect(g); g.connect(out()); o.start(t); o.stop(t+1.2);\n  });\n  /* 3 · basınç dalgası — süzülmüş, kısa */\n  const n=a.createBufferSource(), len=Math.floor(a.sampleRate*0.35), buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);\n  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);\n  n.buffer=buf;\n  const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.4;\n  bp.frequency.setValueAtTime(900,t); bp.frequency.exponentialRampToValueAtTime(140,t+0.34);\n  const ng=a.createGain(); env(ng,t,0.16,0.006,0.36);\n  n.connect(bp); bp.connect(ng); ng.connect(out()); n.start(t);\n}\n\nfunction missSfx(){\n  if(!sndOn)return; const a=ac(), t=a.currentTime;\n  const o=a.createOscillator(), g=a.createGain(), f=a.createBiquadFilter();\n  o.type='sine'; o.frequency.setValueAtTime(240,t); o.frequency.exponentialRampToValueAtTime(70,t+0.45);\n  f.type='lowpass'; f.frequency.value=700;\n  env(g,t,0.10,0.02,0.5);\n  o.connect(f); f.connect(g); g.connect(out()); o.start(t); o.stop(t+0.52);\n}\n\nconst $=id=>document.getElementById(id);\nconst WLAB=['hedef yan hızı','hedef ivmesi','mesafe değişimi','gezegen çekimi','çekim eğrisi','sabit sapma'];\nconst wbars=$('wbars');\nWLAB.forEach(l=>{const d=document.createElement('div');d.className='wb';d.innerHTML='<span>'+l+'<\u002Fspan><span class=\"wt\"><span class=\"wf\"><\u002Fspan><\u002Fspan><span class=\"wv\">0,00<\u002Fspan>';wbars.appendChild(d)});\nconst wf=[...wbars.querySelectorAll('.wf')], wv=[...wbars.querySelectorAll('.wv')];\nfunction drawWeights(){\n  Wb.forEach((v,i)=>{\n    const c=Math.max(-1,Math.min(1,v/2));\n    wf[i].style.left=(c<0?50+c*50:50)+'%';\n    wf[i].style.width=Math.abs(c)*50+'%';\n    wf[i].style.background=c<0?'#B4432E':'#22697F';\n    wv[i].textContent=v.toFixed(2).replace('.',',');\n  });\n}\nfunction hud(){\n  const r=win.length?win.reduce((a,b)=>a+b,0)/win.length:null;\n  $('rate').innerHTML=(r===null?'–':(r*10).toFixed(1).replace('.',','))+'<small> / 10<\u002Fsmall>';\n  $('shots').textContent=totalShots.toLocaleString('tr-TR');\n  $('days').textContent=Math.min(TARGET_DAYS,totalShots/TARGET_SHOTS*TARGET_DAYS).toFixed(0)+' gün';\n}\n\ncv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*(W/r.width),y=(e.clientY-r.top)*(H/r.height);lastMouse=Math.atan2(y-GUN.y,x-GUN.x)});\ncv.addEventListener('click',()=>{if(manual&&!shot){shot={x:GUN.x,y:GUN.y,vx:Math.cos(lastMouse)*BSPD,vy:Math.sin(lastMouse)*BSPD,t:0,trail:[]};shotSfx()}});\n\nlet frame=0, backlog=0;\nfunction loop(){\n  requestAnimationFrame(loop);\n  stepScene(1/60);\n  if(running&&!manual){\n    backlog+=speed*0.09;\n    let n=Math.floor(backlog/BATCH); backlog-=n*BATCH;\n    n=Math.min(n,900);\n    for(let i=0;i<n;i++) trainStep();\n    if(n===0&&backlog>=BATCH*0.999){ trainStep(); backlog=0; }\n  }\n  frame++;\n  if(frame%6===0&&win.length) curve.push(win.reduce((a,b)=>a+b,0)/win.length), curve.length>260&&curve.shift();\n  draw();\n  if(frame%4===0){ drawChart(); hud(); drawWeights(); }\n}\nnewBatch(); win.push(incScore); hud(); drawChart(); drawWeights(); loop();\n\n$('play').onclick=function(){running=!running;if(running&&manual){manual=false;$('manual').classList.remove('on')}this.textContent=running?'❚❚ Duraklat':'▶ Başlat'};\n$('spd').onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$('spd').children].forEach(x=>x.classList.remove('on'));b.classList.add('on');speed=+b.dataset.s};\n$('manual').onclick=function(){manual=!manual;this.classList.toggle('on',manual);\n  $('hint').textContent=manual?'Nişan alın ve tıklayın. Gezegenler mermiyi çekiyor — 10 atışta kaç tutturuyorsunuz?':'Hız arttıkça sahne aynı kalır, arkada binlerce atış birden denenir.'};\n$('snd').addEventListener('click',function(){\n  sndOn=!sndOn;\n  this.textContent=sndOn?'🔊 Ses':'🔇 Sessiz';\n  this.classList.toggle('on',!sndOn);\n  ac();\n  MASTER.gain.cancelScheduledValues(AC.currentTime);\n  MASTER.gain.setValueAtTime(sndOn?0.9:0,AC.currentTime);\n});\n$('prin').addEventListener('click',()=>$('pov').classList.add('on'));\n$('pclose').addEventListener('click',()=>$('pov').classList.remove('on'));\n$('pov').addEventListener('click',e=>{if(e.target===$('pov'))$('pov').classList.remove('on')});\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape')$('pov').classList.remove('on')});\n$('reset').onclick=()=>{Wb=zeros();sigma=.34;totalShots=0;win=[];curve=[];batchAge=1e9;newBatch();win.push(incScore);hud();drawChart();drawWeights()};\n})();\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
