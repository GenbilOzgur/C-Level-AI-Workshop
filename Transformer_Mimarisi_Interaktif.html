<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transformer Mimarisi — Liderler İçin Açıklandı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded non-blocking on purpose. A stylesheet in <head> blocks rendering AND
     the execution of every script below it, so a slow, proxied or blocked
     fonts.googleapis.com leaves the entire page blank — not even the header
     paints, and the inline script at the end of <body> never runs. media="print"
     makes the fetch non-blocking; onload promotes it once it arrives. The page
     is fully legible without it: --font-sans carries a real system fallback
     stack, and the noscript copy keeps the font for JS-disabled readers. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   GENBIL DESIGN SYSTEM — tokens
   Source: Phygital-MarketPlace/design/colors_and_type.css
   Inlined, not linked: this page ships standalone and is served from GitHub
   Pages, where a cross-project <link> cannot resolve.
   ══════════════════════════════════════════════════════════════════════════ */
:root {
  --genbil-paper:#FFFFFF; --genbil-paper-2:#F8FAFC; --genbil-paper-3:#EEF2F7;
  --genbil-line:#E2E8F0;  --genbil-line-2:#CBD5E1;
  --danger:#A4262C; --danger-tint:#FDE7E9;

  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;

  --fs-h3:28px; --lh-h3:1.22; --tr-h3:-0.01em;
  --fs-h4:22px; --lh-h4:1.28;
  --fs-h5:18px; --lh-h5:1.34;
  --fs-body:16px;    --lh-body:1.55;
  --fs-body-sm:14px; --lh-body-sm:1.50;
  --fs-caption:12px; --lh-caption:1.45;
  --fs-eyebrow:12px; --lh-eyebrow:1.20; --tr-eyebrow:0.12em;

  --space-1:4px;  --space-2:8px;  --space-3:12px; --space-4:16px;
  --space-5:24px; --space-6:32px; --space-7:40px;

  --radius-xs:2px; --radius-sm:4px; --radius-md:8px;
  --radius-lg:12px; --radius-pill:999px;

  --motion-fast:120ms; --motion-base:180ms; --motion-slow:320ms;
  --ease-out:cubic-bezier(0.16,1,0.3,1); --ease-std:cubic-bezier(0.2,0,0,1);
}

/* ══════════════════════════════════════════════════════════════════════════
   PHYGITAL BRAND LAYER  (Phygital-MarketPlace/design/pm.css)
   Sage primary, dusty apricot secondary, bone paper. DS neutrals re-pointed
   toward bone and elevation re-tinted warm, exactly as pm.css does.
   ══════════════════════════════════════════════════════════════════════════ */
:root {
  --pm-brand:#6E9080; --pm-brand-deep:#57756A; --pm-brand-tint:#E8F0EC; --pm-brand-soft:#B9CFC4;
  --pm-warm:#DFA684;  --pm-warm-tint:#FAEDE4;  --pm-warm-deep:#B87F5F;
  --pm-gold:#D9B173;
  --pm-cream:#FAF8F4; --pm-cream-2:#F4EFE8; --pm-line:#E7E0D6;
  --pm-ink:#2E3330;   --pm-ink-2:#5A6360;   --pm-ink-3:#8B948F;
  --pm-free:#5B8C7B;
  --pm-rail:#333B37;  --pm-rail-tx:#C4CEC7;

  --genbil-line:#E7E0D6; --genbil-line-2:#D5CCC0;
  --genbil-paper-2:#F7F4EF; --genbil-paper-3:#EFEAE2;
  --genbil-ink:#2E3330; --genbil-ink-2:#5A6360;
  --genbil-ink-3:#8B948F; --genbil-ink-4:#A9B2AC;
  --shadow-1:0 1px 2px rgba(46,51,48,.05), 0 1px 1px rgba(46,51,48,.03);
  --shadow-2:0 4px 14px rgba(46,51,48,.07), 0 1px 3px rgba(46,51,48,.04);
}

/* ══════════════════════════════════════════════════════════════════════════
   SENTENCE + STAGE PALETTES — this page's own addition, and why
   The DS ships --viz-1..6 as Power BI hues (#0078D4, #E3008C, #00B294…).
   Six saturated hues over bone read as a toy shelf, the exact failure
   DESIGN-SYSTEM.md §2 avoids for the poster palettes. So both palettes are
   drawn from the brand layer instead — and, because every one of these
   colours is also used as small body text in the right-hand panel, each was
   measured rather than picked by eye:

     · all twelve clear 4.5:1 on white (WCAG AA, small text)
     · no unintended pair sits closer than ΔE 15 (CIE76)
     · the one close pair is deliberate: "yapay" and "zeka" are ΔE 15.3
       apart because they form the compound concept the page is teaching

   Declared as tokens because the canvas reads them too.
   ══════════════════════════════════════════════════════════════════════════ */
:root {
  /* the six sentence tokens — categorical, contrast 4.54–6.20 */
  --tok-1:#4A7A63;  /* CEO        · sage      — decision maker */
  --tok-2:#7A709C;  /* yapay      · violet    — paired with zeka */
  --tok-3:#554B73;  /* zeka       · violet deep */
  --tok-4:#8A6A31;  /* bütçesini  · ochre     — financial */
  --tok-5:#6B6058;  /* hızla      · taupe     — least semantic word */
  --tok-6:#9C5B52;  /* onayladı   · rust      — the action */

  /* the six transformer stages — sequential, a journey from raw tokens to a
     finished answer, ending on the deepest green as the payoff */
  --stage-1:#7A6D5C; --stage-2:#8A6A31; --stage-3:#7A709C;
  --stage-4:#554B73; --stage-5:#4A7A63; --stage-6:#1F5F44;

  /* the three chapters */
  --step-1:#9C5B52;  /* the old problem */
  --step-2:#554B73;  /* the breakthrough */
  --step-3:#4A7A63;  /* the architecture */
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:var(--pm-cream);
  color:var(--pm-ink);
  font-family:var(--font-sans);
  font-size:var(--fs-body);
  line-height:var(--lh-body);
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ── HEADER — the dark rail, laid horizontally ─────────────────────────── */
header {
  flex-shrink:0;
  display:flex; align-items:center; gap:var(--space-4);
  padding:var(--space-3) var(--space-6);
  background:var(--pm-rail);
  border-bottom:1px solid rgba(255,255,255,.09);
}
.badge {
  flex-shrink:0;
  background:var(--pm-brand-soft); color:#2A3A32;
  font:600 var(--fs-eyebrow)/var(--lh-eyebrow) var(--font-sans);
  letter-spacing:var(--tr-eyebrow); text-transform:uppercase;
  padding:var(--space-1) var(--space-3);
  border-radius:var(--radius-pill);
  white-space:nowrap;
}
header h1 {
  font:500 var(--fs-body-sm)/1.4 var(--font-sans);
  color:var(--pm-rail-tx);
}

/* ── NAV — chip row on the rail ────────────────────────────────────────── */
.nav {
  flex-shrink:0; display:flex; gap:var(--space-1);
  padding:var(--space-2) var(--space-6);
  background:var(--pm-rail);
  border-bottom:1px solid var(--genbil-line);
}
.nav button {
  flex:1;
  display:flex; align-items:center; justify-content:center; gap:var(--space-2);
  padding:var(--space-2) var(--space-3);
  background:transparent; border:0;
  border-radius:var(--radius-md);
  color:var(--pm-rail-tx);
  font:500 var(--fs-body-sm)/1 var(--font-sans);
  cursor:pointer;
  transition:background var(--motion-fast) var(--ease-std),
             color var(--motion-fast) var(--ease-std);
}
.nav button svg { flex-shrink:0; display:block; }
.nav button:hover { background:rgba(255,255,255,.07); color:#FFFFFF; }
.nav button.active {
  background:var(--pm-brand-soft); color:#2A3A32; font-weight:600;
}

/* ── LAYOUT ────────────────────────────────────────────────────────────── */
.main { flex:1; display:flex; overflow:hidden; min-height:0; }
.canvas-wrap {
  flex:0 0 60%; position:relative;
  background:var(--genbil-paper);
  border-right:1px solid var(--genbil-line);
}
canvas { position:absolute; top:0; left:0; width:100%; height:100%; }

/* ── PANEL ─────────────────────────────────────────────────────────────── */
.panel {
  flex:1; min-width:0;
  background:var(--pm-cream);
  padding:var(--space-5);
  overflow-y:auto;
  display:flex; flex-direction:column; gap:var(--space-3);
}
.kicker {
  font:600 var(--fs-eyebrow)/var(--lh-eyebrow) var(--font-sans);
  letter-spacing:var(--tr-eyebrow); text-transform:uppercase;
}
.ptitle {
  font:700 var(--fs-h4)/var(--lh-h4) var(--font-sans);
  color:var(--pm-ink);
}
.divider { height:1px; background:var(--genbil-line); }
.body-text { font-size:var(--fs-body-sm); line-height:var(--lh-body); color:var(--pm-ink-2); }
.body-text strong { color:var(--pm-ink); font-weight:600; }
.body-text em { font-style:italic; color:var(--pm-ink-3); }

/* Compare boxes (chapter 1) */
.compare-row { display:flex; gap:var(--space-2); }
.compare-box {
  flex:1;
  background:var(--genbil-paper);
  border:1px solid var(--genbil-line);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-1);
  padding:var(--space-3) var(--space-4);
  font-size:var(--fs-body-sm); line-height:var(--lh-body-sm);
  color:var(--pm-ink-2);
}
.compare-box.bad  { border-color:#E8C9CB; }
.compare-box.good { border-color:var(--pm-brand-soft); }
.compare-box strong {
  display:flex; align-items:center; gap:var(--space-2);
  margin-bottom:var(--space-2);
  font:600 var(--fs-body-sm)/1.4 var(--font-sans);
}
.compare-box.bad strong  { color:var(--danger); }
.compare-box.good strong { color:var(--pm-brand-deep); }
.compare-box strong svg { flex-shrink:0; }

/* Step list */
.steps-list { display:flex; flex-direction:column; gap:var(--space-2); }
.step-row { display:flex; align-items:flex-start; gap:var(--space-3); }
.step-num {
  width:24px; height:24px; flex-shrink:0;
  border-radius:var(--radius-pill);
  display:flex; align-items:center; justify-content:center;
  font:700 var(--fs-caption)/1 var(--font-sans);
  color:#FFFFFF;
}
.step-row p { font-size:var(--fs-body-sm); line-height:var(--lh-body-sm); color:var(--pm-ink-2); }
.step-row p strong { color:var(--pm-ink); font-weight:600; }

/* QKV concept pills */
.qkv-row { display:flex; gap:var(--space-2); }
.qkv-pill {
  flex:1; text-align:center;
  background:var(--genbil-paper);
  border:1px solid var(--genbil-line);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-1);
  padding:var(--space-3);
  font-size:var(--fs-caption); line-height:var(--lh-caption);
  color:var(--pm-ink-3);
}
.qkv-pill strong { display:block; font:700 var(--fs-h5)/1.2 var(--font-sans); margin-bottom:2px; }
.qkv-pill .qkv-name { display:block; font-weight:600; font-size:var(--fs-body-sm); color:var(--pm-ink-2); margin-bottom:var(--space-1); }

/* QKV live panel */
#qkv-live { display:none; }
.qkv-card {
  background:var(--genbil-paper);
  border:1px solid var(--genbil-line);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-1);
  padding:var(--space-4);
}
.qkv-card > .qkv-head {
  display:flex; align-items:center; gap:var(--space-2);
  font:600 var(--fs-body-sm)/1.3 var(--font-sans);
  margin-bottom:var(--space-3);
}
.qkv-card > .qkv-head svg { flex-shrink:0; }
.bar-row { display:flex; align-items:center; gap:var(--space-2); margin-bottom:var(--space-1); }
.bar-label { font-size:var(--fs-caption); color:var(--pm-ink-2); width:85px; text-align:right; flex-shrink:0; }
.bar-track { flex:1; height:16px; background:var(--genbil-paper-3); border-radius:var(--radius-pill); overflow:hidden; }
.bar-fill  { height:100%; border-radius:var(--radius-pill); transition:width var(--motion-slow) var(--ease-out); }
.bar-val { font-size:var(--fs-caption); color:var(--pm-ink-2); font-weight:600; width:34px; font-variant-numeric:tabular-nums; }
.bar-pct { font-size:var(--fs-caption); font-weight:700; width:42px; text-align:right; font-variant-numeric:tabular-nums; }

/* Layer card */
.layer-card {
  background:var(--genbil-paper);
  border:1px solid var(--genbil-line);
  border-left-width:3px;
  border-radius:0 var(--radius-lg) var(--radius-lg) 0;
  box-shadow:var(--shadow-1);
  padding:var(--space-4);
  font-size:var(--fs-body-sm); line-height:var(--lh-body);
  color:var(--pm-ink-2);
}
.layer-card strong { display:block; font:600 var(--fs-body)/1.3 var(--font-sans); margin-bottom:var(--space-2); }
.layer-card ul { margin-left:18px; }
.business-note {
  background:var(--pm-brand-tint);
  border-left:3px solid var(--pm-brand);
  border-radius:0 var(--radius-md) var(--radius-md) 0;
  padding:var(--space-3) var(--space-4);
  font-size:var(--fs-body-sm); line-height:var(--lh-body-sm);
  color:var(--pm-brand-deep);
}
.business-note strong { display:block; margin-bottom:var(--space-1); font-weight:600; }

/* Analogy */
.analogy {
  display:flex; align-items:flex-start; gap:var(--space-2);
  background:var(--pm-warm-tint);
  border-left:3px solid var(--pm-warm);
  border-radius:0 var(--radius-md) var(--radius-md) 0;
  padding:var(--space-3) var(--space-4);
  font-size:var(--fs-body-sm); line-height:var(--lh-body-sm);
  color:var(--pm-warm-deep);
}
.analogy svg { flex-shrink:0; margin-top:2px; }

.hint {
  display:flex; align-items:center; justify-content:center; gap:var(--space-2);
  font-size:var(--fs-caption); color:var(--pm-ink-3); text-align:center;
}

/* ── RESPONSIVE ────────────────────────────────────────────────────────── */
@media (max-width:1100px) {
  .main { flex-direction:column; overflow-y:auto; }
  .canvas-wrap { flex:0 0 52vh; border-right:0; border-bottom:1px solid var(--genbil-line); }
  .panel { overflow:visible; }
}
@media (max-width:820px) {
  header { padding:var(--space-3) var(--space-4); flex-wrap:wrap; gap:var(--space-2); }
  .nav { padding:var(--space-2) var(--space-4); flex-wrap:wrap; }
  .nav button { flex:1 1 auto; }
  .compare-row, .qkv-row { flex-direction:column; }
}
</style>
</head>
<body>

<header>
  <span class="badge">MODÜL 1 · YAPAY ZEKA DEVRİMİ</span>
  <h1>Transformer Mimarisi — 2017 Her Şeyi Neden Değiştirdi?</h1>
</header>

<div class="nav">
  <button id="btn0" onclick="setStep(0)">
    <svg width="22" height="20" viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <circle cx="4" cy="12" r="2.6" fill="currentColor" stroke="none"/>
      <line x1="7" y1="12" x2="10.5" y2="12"/>
      <circle cx="13" cy="12" r="2.6" fill="currentColor" stroke="none" opacity="0.6"/>
      <line x1="16" y1="12" x2="19" y2="12" opacity="0.4"/>
      <circle cx="21.5" cy="12" r="2.2" fill="currentColor" stroke="none" opacity="0.3"/>
    </svg>
    <span>Eski Sorun: RNN</span>
  </button>
  <button id="btn1" onclick="setStep(1)">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
      <line x1="12" y1="12" x2="12" y2="4"/><line x1="12" y1="12" x2="4" y2="9"/><line x1="12" y1="12" x2="20" y2="9"/><line x1="12" y1="12" x2="6" y2="19"/><line x1="12" y1="12" x2="18" y2="19"/>
      <circle cx="12" cy="4" r="2" fill="currentColor" stroke="none"/><circle cx="4" cy="9" r="2" fill="currentColor" stroke="none"/><circle cx="20" cy="9" r="2" fill="currentColor" stroke="none"/><circle cx="6" cy="19" r="2" fill="currentColor" stroke="none"/><circle cx="18" cy="19" r="2" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="12" r="3" fill="var(--pm-rail)" stroke="currentColor" stroke-width="1.9"/>
    </svg>
    <span>Atılım: Öz-Dikkat &amp; QKV</span>
  </button>
  <button id="btn2" onclick="setStep(2)">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round">
      <path d="M12 3 3 8l9 5 9-5-9-5z" fill="currentColor" fill-opacity="0.16"/>
      <path d="M3 13l9 5 9-5"/>
      <path d="M3 17.5l9 5 9-5" opacity="0.55"/>
    </svg>
    <span>Transformer Katmanları</span>
  </button>
</div>

<div class="main">
  <div class="canvas-wrap"><canvas id="cvs"></canvas></div>
  <div class="panel" id="panel"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  DESIGN TOKEN BRIDGE
// ═══════════════════════════════════════════════════════════
// CSS custom properties do not reach a canvas 2D context, so every colour the
// diagram draws used to be a literal hex. This reads the palettes once from
// :root, giving the canvas and the panel a single source of truth: change a
// token and both follow. The contrast and ΔE guarantees written into the
// stylesheet therefore hold for the canvas too.
const PM = (function(){
  const cs = getComputedStyle(document.documentElement);
  const t = n => cs.getPropertyValue(n).trim();
  return {
    ink:t('--pm-ink'), ink2:t('--pm-ink-2'), ink3:t('--pm-ink-3'),
    paper:t('--genbil-paper'), paper2:t('--genbil-paper-2'), paper3:t('--genbil-paper-3'),
    line:t('--genbil-line'), line2:t('--genbil-line-2'),
    brand:t('--pm-brand'), brandDeep:t('--pm-brand-deep'),
    brandTint:t('--pm-brand-tint'), brandSoft:t('--pm-brand-soft'),
    warm:t('--pm-warm'), warmDeep:t('--pm-warm-deep'), warmTint:t('--pm-warm-tint'),
    gold:t('--pm-gold'), free:t('--pm-free'), danger:t('--danger'),
    tok:   [1,2,3,4,5,6].map(i=>t('--tok-'+i)),
    stage: [1,2,3,4,5,6].map(i=>t('--stage-'+i)),
    step:  [1,2,3].map(i=>t('--step-'+i))
  };
})();

// Blend a token toward another colour — used to derive each sentence token's
// pale card background from the token itself, so the pair can never drift.
function mix(hex, toward, w){
  const p = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const a = p(hex), b = p(toward);
  return '#' + a.map((v,i)=>Math.round(v+(b[i]-v)*w).toString(16).padStart(2,'0')).join('').toUpperCase();
}

// ═══════════════════════════════════════════════════════════
//  ICONOGRAPHY — Lucide, monoline, 1.9 stroke
// ═══════════════════════════════════════════════════════════
// The DS Iconography section specifies Lucide. The page used emoji (bulb, bolt,
// check, cross, stopwatch),
// which render as platform-dependent colour bitmaps that no token can restyle.
const ICON_PATHS = {
  bulb:  '<path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  x:     '<path d="M18 6 6 18M6 6l12 12"/>',
  zap:   '<path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4.35-4.35"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>',
  layers:'<path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 12l10 5 10-5"/><path d="M2 17l10 5 10-5"/>',
  up:    '<path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>'
};
function icon(name, size){
  const d = ICON_PATHS[name];
  if(!d) return '';
  const px = size || 15;
  return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 24 24" fill="none" '+
         'stroke="currentColor" stroke-width="1.9" stroke-linecap="round" '+
         'stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';
}
// ═══════════════════════════════════════════════════════════
//  VERİ
// ═══════════════════════════════════════════════════════════

const SENTENCE = ['CEO','yapay','zeka','bütçesini','hızla','onayladı'];
const TOKEN_COLORS = PM.tok;
// Pale card grounds, derived from the tokens rather than hand-picked.
const TOKEN_LIGHT  = PM.tok.map(c => mix(c, PM.paper, 0.88));

// Dikkat ağırlıkları (satır=sorgu, sütun=anahtar)
const ATTN = [
  [0.93, 0.18, 0.24, 0.56, 0.11, 0.82],  // CEO
  [0.17, 0.95, 0.89, 0.71, 0.08, 0.12],  // yapay

// ═══════════════════════════════════════════════════════════
//  BAŞLATMA
// ═══════════════════════════════════════════════════════════
// Boot used to hang off window 'load'. That event waits for every subresource,
// including the Google Fonts stylesheet — so if that request is slow, blocked
// by a proxy or blocker, or stuck in DNS, 'load' never fires and NOTHING here
// runs: no canvas sizing, no setStep(0) to fill the panel, no draw loop. The
// page then renders the header and nav and nothing else, which reads as a
// blank page. Local file:// testing never caught it because the font request
// fails fast there. Start on DOMContentLoaded instead — the markup is all we
// actually depend on — and re-measure later once webfonts land, since they
// change text metrics the canvas relies on.
function boot() {
  cvs = document.getElementById('cvs');
  resize(); window.addEventListener('resize', resize);
  cvs.addEventListener('click', handleClick);
  cvs.addEventListener('mousemove', handleHover);
  setStep(0);
  requestAnimationFrame(loop);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();   // script sits at the end of <body>, so this is the usual path
}

// Measuring the container once is not enough. At DOMContentLoaded the flex
// parent can still report clientWidth/Height 0 — an embedded pane, a tab
// opened in the background, a container that only gets its size a frame
// later — and a one-shot measurement then locks the canvas at 1px for good:
// the panel fills in, the diagram never appears. Observing the parent instead
// means the canvas is sized by the layout itself, whenever that happens.
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(() => { if (cvs) resize(); })
    .observe(document.querySelector('.canvas-wrap'));
}

// Webfonts change text metrics the canvas measures against, so re-measure once
// they land. Only a refinement — the page is already drawn without it.
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => { if (cvs) resize(); }).catch(() => {});
}

function resize() {
  const wp = cvs.parentElement;
  // Guard against a zero-sized parent: a 0x0 canvas draws nothing and would
  // look like the same blank page for a different reason.
  const cssW = Math.max(wp.clientWidth, 1), cssH = Math.max(wp.clientHeight, 1);
  const dpr = Math.max(2, Math.ceil(window.devicePixelRatio || 1));
  cvs.width = cssW * dpr; cvs.height = cssH * dpr;
  cvs.style.width = cssW + 'px'; cvs.style.height = cssH + 'px';
  W = cssW; H = cssH;
  ctx = cvs.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// ═══════════════════════════════════════════════════════════
//  YARDIMCILAR
// ═══════════════════════════════════════════════════════════
function lerp(a,b,t){ return a+(b-a)*t; }
function ease(t){ return t<0.5?2*t*t:-1+(4-2*t)*t; }
// Now fed from design tokens rather than literals. Unregistered custom
// properties come back from getComputedStyle as authored, so these are hex —
// but a browser that normalises to rgb() would otherwise produce NaN here, so
// pass such values through and only parse what is actually hex.
function hexAlpha(hex,a){
  if(!hex || hex[0] !== '#') return hex;
  let h = hex.slice(1);
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}
// A sentence row gets ONE font size, derived from its widest word. The first
// fix here shrank each word independently, which fit everything but made
// "bütçesini" visibly smaller than its neighbours — worse than the overflow.
// Sizing the whole row off the widest word keeps the line uniform; widening
// the box off the same measurement (rowBoxW) keeps the shrink rare.
function rowFontPx(words, maxW, startPx){
  const f = px => 'bold ' + px + 'px Inter, system-ui, sans-serif';
  let px = Math.round(startPx);
  ctx.font = f(px);
  const widest = () => Math.max(...words.map(w => ctx.measureText(w).width));
  while(px > 9 && widest() > maxW){ px -= 1; ctx.font = f(px); }
  return px;
}
function setRowFont(px, bold){
  ctx.font = (bold ? 'bold ' : '') + px + 'px Inter, system-ui, sans-serif';
}
// Box width for a row of n boxes: wide enough for the widest word at 16px
// (+padding), never wider than fits the canvas with 8px minimum gaps.
function rowBoxW(n, mx){
  ctx.font = 'bold 16px Inter, system-ui, sans-serif';
  const widest = Math.max(...SENTENCE.map(w => ctx.measureText(w).width));
  const avail = W - 2*mx;
  return Math.min(Math.max(W*0.115, widest + 24), (avail - (n-1)*8) / n);
}

function roundRect(cx,cy,w,h,r,fill,stroke,lw){
  const x=cx-w/2,y=cy-h/2;
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}
}

function getTokenLayout(){
  const n=SENTENCE.length;
  const mx=28, th=40;
  // Box width used to be a flat 11.5% of the canvas, which ignores what is
  // actually in the box: "bütçesini" is half again as long as "CEO" and
  // overflowed at every viewport. Size the box from the widest word instead,
  // then cap it so the row still fits the canvas. fitFont takes up the last
  // few pixels; at presentation widths nothing has to shrink at all.
  ctx.save();
  ctx.font='16px Inter, system-ui, sans-serif';
  const widest=Math.max(...SENTENCE.map(w=>ctx.measureText(w).width));
  ctx.restore();
  const avail=W-2*mx;
  const tw=Math.min(Math.max(W*0.115, widest+24), (avail-(n-1)*8)/n);
  const gap=(avail-n*tw)/(n-1);
  return SENTENCE.map((_,i)=>({
    x:mx+i*(tw+gap),y:H*0.5-th/2,
    w:tw,h:th,cx:mx+i*(tw+gap)+tw/2,cy:H*0.5
  }));
}

// ═══════════════════════════════════════════════════════════
//  ETKİLEŞİM
// ═══════════════════════════════════════════════════════════
function handleHover(e){
  const rc=cvs.getBoundingClientRect();
  const mx=(e.clientX-rc.left)*(W/rc.width);
  const my=(e.clientY-rc.top)*(H/rc.height);
  if(currentStep===1){
    const rects=getTokenLayout();
    cvs.style.cursor=rects.some(t=>mx>=t.x&&mx<=t.x+t.w&&my>=t.y&&my<=t.y+t.h)?'pointer':'default';
  } else if(currentStep===2){
    let h='';
    if(navRects.prev&&inRect(mx,my,navRects.prev)) h='prev';
    if(navRects.next&&inRect(mx,my,navRects.next)) h='next';
    hoverNav=h;
    cvs.style.cursor=h?'pointer':'default';
  } else {
    cvs.style.cursor='default';
  }
}

function handleClick(e){
  const rc=cvs.getBoundingClientRect();
  const mx=(e.clientX-rc.left)*(W/rc.width);
  const my=(e.clientY-rc.top)*(H/rc.height);

  if(currentStep===1){
    const rects=getTokenLayout();
    rects.forEach((t,i)=>{
      if(mx>=t.x&&mx<=t.x+t.w&&my>=t.y&&my<=t.y+t.h){
        selectedToken=i; attnAnim=0;
        updateQKVPanel(i);
      }
    });
  } else if(currentStep===2){
    if(navRects.prev&&inRect(mx,my,navRects.prev)&&currentLayer>0){
      currentLayer--;
      targetKnowledge=[...LAYER_STAGES[currentLayer].knowledge];
      updateLayerPanel();
    }
    if(navRects.next&&inRect(mx,my,navRects.next)&&currentLayer<LAYER_STAGES.length-1){
      currentLayer++;
      targetKnowledge=[...LAYER_STAGES[currentLayer].knowledge];
      updateLayerPanel();
    }
  }
}

function inRect(mx,my,r){ return mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h; }

// ═══════════════════════════════════════════════════════════
//  ADIM 0: RNN vs TRANSFORMER
// ═══════════════════════════════════════════════════════════
function drawStep0(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PM.paper; ctx.fillRect(0,0,W,H);

  const n=SENTENCE.length;
  const mx=28, bh=36;
  const bw=rowBoxW(n, mx);
  const gapX=(W-2*mx-n*bw)/(n-1);
  const rowPx=rowFontPx(SENTENCE, bw-12, Math.min(bw*0.24,17));

  // ── RNN bölümü ──
  const rnnY=H*0.28;
  ctx.fillStyle=hexAlpha(PM.danger,0.05);
  ctx.fillRect(W*0.02,rnnY-64,W*0.96,130);

  ctx.font='bold 14px Inter, system-ui, sans-serif'; ctx.fillStyle=PM.danger; ctx.textAlign='left';
  ctx.fillText('ESKİ YÖL  ·  RNN (Yinelemeli Sinir Ağı)  ·  Sıralı İşleme — Kelime Kelime', W*0.04,rnnY-46);

  SENTENCE.forEach((word,i)=>{
    const bx=mx+i*(bw+gapX);
    // fade: 1.0 (CEO) → 0.18 (onayladı) — bellek zayıflıyor
    const fade=Math.max(1-i*0.15,0.18);

    // Bellek kayıp çubuğu (token altında küçülen kırmızı bar)
    const barMaxW=bw*0.7;
    ctx.fillStyle=hexAlpha(PM.danger,0.25*fade);
    ctx.fillRect(bx+(bw-barMaxW*fade)/2,rnnY+bh/2+10,barMaxW*fade,5);

    // Token kutusu: BEYAZ arka plan, kırmızı kenarlık (okunabilirlik için)
    roundRect(bx+bw/2,rnnY,bw,bh,5,
      PM.paper,                                        // her zaman beyaz arka plan
      hexAlpha(PM.danger,Math.max(0.75*fade,0.22)),   // kırmızı kenarlık solar
      2);
    // Metin: koyu mürekkep ama opacity ile solar — kırmızı değil!
    setRowFont(rowPx, i===0);
    ctx.fillStyle=hexAlpha(PM.ink,Math.max(fade,0.25));
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(word,bx+bw/2,rnnY); ctx.textBaseline='alphabetic';

    // Ok → (bellek aktarım zinciri, o da solar)
    if(i<n-1){
      const ax=bx+bw+2,ay=rnnY,aw=gapX-2;
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ax+aw-7,ay);
      ctx.strokeStyle=hexAlpha(PM.danger,Math.max(fade*0.65,0.10));
      ctx.lineWidth=1.5; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ax+aw-7,ay-5); ctx.lineTo(ax+aw,ay); ctx.lineTo(ax+aw-7,ay+5);
      ctx.fillStyle=hexAlpha(PM.danger,Math.max(fade*0.55,0.10)); ctx.fill();
    }
  });

  ctx.font='14px Inter, system-ui, sans-serif'; ctx.fillStyle=hexAlpha(PM.danger,0.85); ctx.textAlign='center';
  ctx.fillText('▼ "CEO" ile başlayan bağlam, "onayladı"ya gelindiğinde büyük ölçüde unutulmuştur ▼',W/2,rnnY+bh/2+32);
  ctx.font='14px Inter, system-ui, sans-serif'; ctx.fillStyle=hexAlpha(PM.danger,0.7); ctx.textAlign='left';
  ctx.fillText('Her seferinde 1 kelime işlenir — paralel işleme mümkün değil → YAVAŞ',W*0.04,rnnY+bh/2+52);

  // Ayırıcı
  ctx.beginPath(); ctx.moveTo(W*0.05,H*0.5); ctx.lineTo(W*0.95,H*0.5);
  ctx.strokeStyle=hexAlpha(PM.ink3,0.2); ctx.lineWidth=1.5;
  ctx.setLineDash([6,6]); ctx.stroke(); ctx.setLineDash([]);

  // ── Transformer bölümü ──
  const txY=H*0.73;
  ctx.fillStyle=hexAlpha(PM.brand,0.06);
  ctx.fillRect(W*0.02,txY-64,W*0.96,130);

  ctx.font='bold 14px Inter, system-ui, sans-serif'; ctx.fillStyle=PM.brandDeep; ctx.textAlign='left';
  ctx.fillText('YENİ YOL  ·  TRANSFORMER  ·  Paralel İşleme — Tüm Kelimeler Eş Zamanlı',W*0.04,txY-46);

  const tokenCX=SENTENCE.map((_,i)=>mx+i*(bw+gapX)+bw/2);
  const pulse=0.45+0.3*Math.sin(frame*0.04);
  tokenCX.forEach((x1,i)=>{
    tokenCX.forEach((x2,j)=>{
      if(i>=j) return;
      const str=ATTN[i][j]*0.5;
      ctx.beginPath(); ctx.moveTo(x1,txY); ctx.lineTo(x2,txY);
      ctx.strokeStyle=hexAlpha(PM.brand,str*pulse);
      ctx.lineWidth=ATTN[i][j]*3.8+0.6; ctx.stroke();
    });
  });

  SENTENCE.forEach((word,i)=>{
    const bx=mx+i*(bw+gapX);
    roundRect(bx+bw/2,txY,bw,bh,5,
      hexAlpha(TOKEN_LIGHT[i],1),TOKEN_COLORS[i],2);
    setRowFont(rowPx, true);
    ctx.fillStyle=TOKEN_COLORS[i];
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(word,bx+bw/2,txY); ctx.textBaseline='alphabetic';
  });

  ctx.font='14px Inter, system-ui, sans-serif'; ctx.fillStyle=hexAlpha(PM.brandDeep,0.9); ctx.textAlign='left';
  ctx.fillText('Tüm kelimeler aynı anda işleniyor — devasa paralelleştirme → 100× daha hızlı eğitim',W*0.04,txY+bh/2+30);
  ctx.fillText('Tam bağlam korunuyor — "onayladı" her zaman "CEO" ile doğrudan bağlantı kuruyor',W*0.04,txY+bh/2+48);
}

// ═══════════════════════════════════════════════════════════
//  ADIM 1: ÖZ-DİKKAT
// ═══════════════════════════════════════════════════════════
function drawStep1(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PM.paper; ctx.fillRect(0,0,W,H);

  const rects=getTokenLayout();
  const sel=selectedToken;
  attnAnim=Math.min(attnAnim+0.028,1);

  // Dikkat yayları
  rects.forEach((t,j)=>{
    if(j===sel) return;
    const w=ATTN[sel][j];
    const animW=ease(attnAnim)*w;
    if(animW<0.04) return;

    const x1=rects[sel].cx,y1=rects[sel].cy;
    const x2=t.cx,y2=t.cy;
    const dist=Math.abs(x2-x1);
    const curveDip=-dist*0.42;
    const midX=(x1+x2)/2,midY=y1+curveDip;

    // Glow
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.quadraticCurveTo(midX,midY,x2,y2);
    ctx.strokeStyle=hexAlpha(TOKEN_COLORS[sel],animW*0.15);
    ctx.lineWidth=(w*6+1)*2.5; ctx.stroke();

    // Ana yay
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.quadraticCurveTo(midX,midY,x2,y2);
    ctx.strokeStyle=hexAlpha(TOKEN_COLORS[sel],animW*0.85);
    ctx.lineWidth=w*6+1.2; ctx.stroke();

    // Ağırlık etiketi
    if(w>=0.2){
      const t2=0.55;
      const lx=(1-t2)*(1-t2)*x1+2*(1-t2)*t2*midX+t2*t2*x2;
      const ly=(1-t2)*(1-t2)*y1+2*(1-t2)*t2*midY+t2*t2*y2+14;
      ctx.font='bold 16px Inter, system-ui, sans-serif';
      ctx.fillStyle=hexAlpha(TOKEN_COLORS[sel],animW*0.95);
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(Math.round(w*100)+'%',lx,ly);
      ctx.textBaseline='alphabetic';
    }
  });

  // Token kutuları
  rects.forEach((t,i)=>{
    const isSel=i===sel;
    const weight=ATTN[sel][i];
    const glowCol=isSel?TOKEN_COLORS[i]:(ease(attnAnim)*weight>0.28?TOKEN_COLORS[sel]:null);

    if(glowCol){
      ctx.beginPath(); ctx.arc(t.cx,t.cy,t.h*0.75,0,Math.PI*2);
      ctx.fillStyle=hexAlpha(glowCol,0.10); ctx.fill();
    }

    roundRect(t.cx,t.cy,t.w,t.h,6,
      isSel?TOKEN_LIGHT[i]:hexAlpha(TOKEN_LIGHT[i],0.85),
      isSel?TOKEN_COLORS[i]:hexAlpha(TOKEN_COLORS[i],0.6),
      isSel?2.5:1.5);

    setRowFont(rowFontPx(SENTENCE, t.w-12, Math.min(t.w*0.26,18)), isSel);
    ctx.fillStyle=TOKEN_COLORS[i];
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(SENTENCE[i],t.cx,t.cy); ctx.textBaseline='alphabetic';

    if(isSel){
      ctx.font='bold 13px Inter, system-ui, sans-serif'; ctx.fillStyle=TOKEN_COLORS[i];
      ctx.textAlign='center';
      ctx.fillText('SORGU (Q)',t.cx,t.cy+t.h/2+16);
    } else if(ease(attnAnim)*weight>0.25){
      ctx.font='12px Inter, system-ui, sans-serif'; ctx.fillStyle=hexAlpha(TOKEN_COLORS[sel],0.7);
      ctx.textAlign='center';
      ctx.fillText('ANAHTAR (K)',t.cx,t.cy+t.h/2+16);
    }
  });

  // Alt mesaj
  ctx.font='bold 16px Inter, system-ui, sans-serif'; ctx.fillStyle=TOKEN_COLORS[sel];
  ctx.textAlign='center';
  ctx.fillText(`"${SENTENCE[sel]}" diğer kelimelere soruyor: "Beni anlamak için kim bana en çok yardımcı olur?"`,W/2,H*0.88);
  ctx.font='14px Inter, system-ui, sans-serif'; ctx.fillStyle=hexAlpha(PM.ink3,0.9); ctx.textAlign='center';
  ctx.fillText('↑  Herhangi bir kelimeye tıklayın — QKV hesaplamasını görün',W/2,H*0.94);
}

// ═══════════════════════════════════════════════════════════
//  ADIM 2: TRANSFORMER KATAMANLAR
// ═══════════════════════════════════════════════════════════
function drawStep2(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=PM.paper; ctx.fillRect(0,0,W,H);

  const n=SENTENCE.length;
  const stage=LAYER_STAGES[currentLayer];

  // Bilgi barlarını yumuşak animasyon
  displayKnowledge=displayKnowledge.map((v,i)=>lerp(v,targetKnowledge[i],0.07));

  const margX=28, th=38;
  const tw=rowBoxW(n, margX);
  const gap=(W-2*margX-n*tw)/(n-1);
  const row2Px=rowFontPx(SENTENCE, tw-12, Math.min(tw*0.24,17));
  const tokenY=H*0.14;
  const barMaxH=H*0.20;
  const barY=tokenY+th/2+10;

  // Bilgi barları (token altında büyüyen)
  SENTENCE.forEach((word,i)=>{
    const tx=margX+i*(tw+gap);
    const kn=displayKnowledge[i];
    const barH=barMaxH*kn;

    // Arka plan
    ctx.fillStyle=hexAlpha(PM.line2,0.35);
    ctx.fillRect(tx+tw*0.15,barY,tw*0.70,barMaxH);
    // Dolgu
    const barGrd=ctx.createLinearGradient(0,barY+barMaxH-barH,0,barY+barMaxH);
    barGrd.addColorStop(0,hexAlpha(TOKEN_COLORS[i],0.9));
    barGrd.addColorStop(1,hexAlpha(TOKEN_COLORS[i],0.5));
    ctx.fillStyle=barGrd;
    ctx.fillRect(tx+tw*0.15,barY+barMaxH-barH,tw*0.70,barH);
    // Yüzde
    ctx.font='bold 15px Inter, system-ui, sans-serif'; ctx.fillStyle=TOKEN_COLORS[i];
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(Math.round(kn*100)+'%',tx+tw/2,barY+barMaxH+14);
    ctx.textBaseline='alphabetic';
  });

  // Token kutuları
  SENTENCE.forEach((word,i)=>{
    const tx=margX+i*(tw+gap);
    roundRect(tx+tw/2,tokenY,tw,th,5,
      TOKEN_LIGHT[i],TOKEN_COLORS[i],2);
    setRowFont(row2Px, true);
    ctx.fillStyle=TOKEN_COLORS[i];
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(word,tx+tw/2,tokenY); ctx.textBaseline='alphabetic';
  });

  // Odak yayları (bu katmanda hangi çiftler işleniyor)
  const tokenCX=SENTENCE.map((_,i)=>margX+i*(tw+gap)+tw/2);
  const arcY=barY+barMaxH*0.5;
  stage.focus.forEach(([a,b])=>{
    const x1=tokenCX[a],x2=tokenCX[b];
    const dip=Math.abs(x2-x1)*0.35;
    // Glow
    ctx.beginPath(); ctx.moveTo(x1,arcY); ctx.quadraticCurveTo((x1+x2)/2,arcY-dip,x2,arcY);
    ctx.strokeStyle=hexAlpha(stage.color,0.15); ctx.lineWidth=8; ctx.stroke();
    // Ana çizgi
    ctx.beginPath(); ctx.moveTo(x1,arcY); ctx.quadraticCurveTo((x1+x2)/2,arcY-dip,x2,arcY);
    ctx.strokeStyle=hexAlpha(stage.color,0.85); ctx.lineWidth=3.5; ctx.stroke();
    // Okbaşı
    const ex=x2,ey=arcY;
    const t2=0.95;
    const prevX=(1-t2)*(1-t2)*x1+2*(1-t2)*t2*(x1+x2)/2+t2*t2*x2;
    const prevY=(1-t2)*(1-t2)*arcY+2*(1-t2)*t2*(arcY-dip)+t2*t2*arcY;
    const ang=Math.atan2(ey-prevY,ex-prevX);
    ctx.beginPath();
    ctx.moveTo(ex-8*Math.cos(ang-0.4),ey-8*Math.sin(ang-0.4));
    ctx.lineTo(ex,ey);
    ctx.lineTo(ex-8*Math.cos(ang+0.4),ey-8*Math.sin(ang+0.4));
    ctx.strokeStyle=stage.color; ctx.lineWidth=2; ctx.stroke();
  });

  // Katman başlığı bandı
  const bandY=H*0.52,bandH=50;
  ctx.fillStyle=hexAlpha(stage.color,0.06);
  ctx.fillRect(0,bandY,W,bandH);
  ctx.strokeStyle=hexAlpha(stage.color,0.2); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,bandY); ctx.lineTo(W,bandY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,bandY+bandH); ctx.lineTo(W,bandY+bandH); ctx.stroke();

  ctx.font='bold 13px Inter, system-ui, sans-serif'; ctx.fillStyle=hexAlpha(stage.color,0.7);
  ctx.textAlign='left'; ctx.fillText('KATMAN',28,bandY+18);
  ctx.font='bold 34px Inter, system-ui, sans-serif'; ctx.fillStyle=stage.color;
  ctx.fillText(stage.range,28,bandY+46);
  ctx.font='bold 20px Inter, system-ui, sans-serif'; ctx.fillStyle=PM.ink;
  ctx.textAlign='center'; ctx.fillText(stage.name,W/2,bandY+32);

  // İlerleme noktaları
  const dotY=H*0.64, dotR=7, dotGap=22;
  const totalDots=LAYER_STAGES.length;
  const dotsX=W/2-((totalDots-1)*dotGap)/2;
  LAYER_STAGES.forEach((_,k)=>{
    const dx=dotsX+k*dotGap;
    ctx.beginPath(); ctx.arc(dx,dotY,dotR,0,Math.PI*2);
    if(k===currentLayer){
      ctx.fillStyle=stage.color; ctx.shadowColor=stage.color; ctx.shadowBlur=10;
      ctx.fill(); ctx.shadowBlur=0;
    } else if(k<currentLayer){
      ctx.fillStyle=hexAlpha(stage.color,0.45); ctx.fill();
    } else {
      ctx.fillStyle=PM.paper3; ctx.fill();
      ctx.strokeStyle=PM.line2; ctx.lineWidth=1.5; ctx.stroke();
    }
  });
  ctx.font='14px Inter, system-ui, sans-serif'; ctx.fillStyle=PM.ink3; ctx.textAlign='center';
  ctx.fillText(`${currentLayer+1} / ${totalDots}  aşama`,W/2,dotY+20);

  // Gezinme butonları
  const btnW=150,btnH=40,btnY=H*0.75;
  navRects={};

  if(currentLayer>0){
    const bx=W/2-btnW-16,by=btnY-btnH/2;
    const hov=hoverNav==='prev';
    roundRect(W/2-btnW/2-16,btnY,btnW,btnH,8,
      hov?PM.paper3:PM.paper,PM.line2,1.5);
    ctx.font='bold 15px Inter, system-ui, sans-serif'; ctx.fillStyle=PM.ink2;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('← Önceki Aşama',W/2-btnW/2-16,btnY);
    ctx.textBaseline='alphabetic';
    navRects.prev={x:bx,y:by,w:btnW,h:btnH};
  }

  if(currentLayer<LAYER_STAGES.length-1){
    const bx=W/2+16,by=btnY-btnH/2;
    const hov=hoverNav==='next';
    roundRect(W/2+btnW/2+16,btnY,btnW,btnH,8,
      hov?stage.color:hexAlpha(stage.color,0.85),null,0);
    ctx.font='bold 15px Inter, system-ui, sans-serif'; ctx.fillStyle=PM.paper;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('Sonraki Aşama →',W/2+btnW/2+16,btnY);
    ctx.textBaseline='alphabetic';
    navRects.next={x:bx,y:by,w:btnW,h:btnH};
  }

  // Tamamlandı mesajı
  if(currentLayer===LAYER_STAGES.length-1){
    ctx.font='bold 15px Inter, system-ui, sans-serif'; ctx.fillStyle=hexAlpha(PM.stage[5],0.9);
    ctx.textAlign='center';
    ctx.fillText('Tüm katmanlar tamamlandı — model yanıt üretmeye hazır!',W/2,H*0.88);
  }

  // "Anlama" çubuğu (global)
  const avgKn=displayKnowledge.reduce((a,b)=>a+b,0)/displayKnowledge.length;
  const meterW=W*0.6,meterH=8,meterX=W*0.2,meterY=H*0.93;
  ctx.fillStyle=PM.paper3; ctx.fillRect(meterX,meterY,meterW,meterH);
  const mGrd=ctx.createLinearGradient(meterX,0,meterX+meterW*avgKn,0);
  mGrd.addColorStop(0,PM.stage[0]); mGrd.addColorStop(1,PM.stage[5]);
  ctx.fillStyle=mGrd; ctx.fillRect(meterX,meterY,meterW*avgKn,meterH);
  ctx.font='bold 15px Inter, system-ui, sans-serif'; ctx.fillStyle=PM.ink; ctx.textAlign='center';
  ctx.fillText(`Ortalama Anlama Derinliği: %${Math.round(avgKn*100)}`,W/2,meterY-8);
}

// ═══════════════════════════════════════════════════════════
//  ANA DÖNGÜ
// ═══════════════════════════════════════════════════════════
function loop(){
  if(currentStep===0) drawStep0();
  else if(currentStep===1) drawStep1();
  else drawStep2();
  frame++;
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════════
//  QKV PANEL GÜNCELLEMESİ
// ═══════════════════════════════════════════════════════════
function computeQKScore(qi,ki){
  const q=Q_VECS[qi],k=K_VECS[ki];
  let s=0; for(let d=0;d<q.length;d++) s+=q[d]*k[d];
  return s;
}

function updateQKVPanel(tokenIdx){
  const q=Q_VECS[tokenIdx];
  const word=SENTENCE[tokenIdx];
  const color=TOKEN_COLORS[tokenIdx];
  const lightColor=TOKEN_LIGHT[tokenIdx];

  // Q vektörü
  const qBars=DIM_LABELS.map((d,di)=>`
    <div class="bar-row">
      <span class="bar-label">${d}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(q[di]*100)}%;background:${color}"></div></div>
      <span class="bar-val">${q[di].toFixed(2)}</span>
    </div>
  `).join('');

  // Q·K skorları
  const scores=SENTENCE.map((_,j)=>computeQKScore(tokenIdx,j));
  const maxScore=Math.max(...scores);

  const qkBars=SENTENCE.map((w,j)=>`
    <div class="bar-row">
      <span class="bar-label" style="color:${TOKEN_COLORS[j]};font-weight:700">${w}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(scores[j]/maxScore*100)}%;background:${TOKEN_COLORS[j]}"></div></div>
      <span class="bar-val">${scores[j].toFixed(2)}</span>
      <span class="bar-pct" style="color:${TOKEN_COLORS[j]}">%${Math.round(ATTN[tokenIdx][j]*100)}</span>
    </div>
  `).join('');

  // Ağırlıklı V bileşeni (en yüksek 2 dikkat)
  const topTwo=SENTENCE.map((_,j)=>({j,attn:ATTN[tokenIdx][j]}))
    .sort((a,b)=>b.attn-a.attn).slice(0,2);
  const vSummary=topTwo.map(t=>`<span style="color:${TOKEN_COLORS[t.j]};font-weight:700">"${SENTENCE[t.j]}"</span> (%${Math.round(t.attn*100)})`).join(' + ');

  document.getElementById('qkv-live').style.display='flex';
  document.getElementById('qkv-live').innerHTML=`
    <div class="qkv-card" style="background:${lightColor};border-color:${color}33">
      <div class="qkv-head" style="color:${color}">
        ${icon('search',15)}Q("${word}") — Ben ne arıyorum?
      </div>
      ${qBars}
    </div>
    <div class="qkv-card">
      <div class="qkv-head" style="color:var(--pm-brand-deep)">
        ${icon('target',15)}Q·K Skorları → Dikkat Ağırlıkları
      </div>
      ${qkBars}
      <p style="font-size:var(--fs-caption);color:var(--pm-ink-3);margin-top:var(--space-2);font-style:italic">Sütunlar: [ham Q·K skoru] → [nihai dikkat yüzdesi]</p>
    </div>
    <div class="qkv-card" style="background:var(--pm-warm-tint);border-color:var(--pm-warm)">
      <div class="qkv-head" style="color:var(--pm-warm-deep)">${icon('zap',15)}V — Ne Öğrenildi?</div>
      <p style="font-size:var(--fs-body-sm);color:var(--pm-ink-2)">"${word}" kelimesi en çok ${vSummary} kelimelerinden bilgi topladı.</p>
      <p style="font-size:var(--fs-caption);color:var(--pm-warm-deep);margin-top:var(--space-1);font-style:italic">Bu bilgi bir sonraki katmana aktarılır.</p>
    </div>
  `;
  document.getElementById('click-hint').style.display='none';
}

function updateLayerPanel(){
  const s=LAYER_STAGES[currentLayer];
  const insightLines=s.insight.split('\n').map(l=>`<li style="margin-bottom:5px">${l}</li>`).join('');

  document.getElementById('layer-dynamic').innerHTML=`
    <div class="layer-card" style="border-left-color:${s.color}">
      <strong style="color:${s.color}">${icon('layers',16)} Katman ${s.range}: ${s.name}</strong>
      <ul>${insightLines}</ul>
    </div>
    <div class="business-note">
      <strong>İş Dünyası İçin Anlamı:</strong>
      ${s.business}
    </div>
    <div class="analogy">${icon('bulb',16)}<span>${s.analogy}</span></div>
  `;
}

// ═══════════════════════════════════════════════════════════
//  STEP GEÇME
// ═══════════════════════════════════════════════════════════
function setStep(i){
  currentStep=i; frame=0;
  navRects={}; hoverNav='';
  if(i===1){ attnAnim=0; selectedToken=0; }
  if(i===2){ currentLayer=0; targetKnowledge=[...LAYER_STAGES[0].knowledge]; displayKnowledge=new Array(6).fill(0.10); }
  [0,1,2].forEach(j=>document.getElementById('btn'+j).classList.toggle('active',j===i));
  const c=PANEL_STATIC[i];
  document.getElementById('panel').innerHTML=`
    <div class="kicker" style="color:${c.kColor}">${c.kicker}</div>
    <div class="ptitle">${c.title}</div>
    <div class="divider"></div>
    ${c.html}
  `;
  if(i===2) updateLayerPanel();
  if(i===1){ updateQKVPanel(0); attnAnim=0; }
}
